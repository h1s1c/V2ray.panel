services:
  - type: web
    name: config-panel
    runtime: python
    plan: starter            # دیسک دائمی در پلن رایگان وجود ندارد
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: BEHIND_PROXY
        value: "1"
      - key: ADMIN_PATH
        value: change-me-secret-path
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
